name: CI

on:
  # Branch pushes produce checks on the exact commit required by maistro.
  push:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Keep this check name aligned with projects.required_checks in config.toml.
    name: test
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"
    steps:
      - name: Check out tested commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install fixture dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap build-essential pkg-config python3

      - name: Install Rust
        run: |
          rustup toolchain install 1.93.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.93.1

      - name: Verify namespace support
        # Fail rather than skip the isolation and recovery acceptance tests.
        run: bwrap --ro-bind / / --unshare-pid --unshare-net --proc /proc --dev /dev -- /bin/true

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Lint all targets
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Build fixture helper binary
        run: cargo build --locked --bins

      - name: Run all tests including host isolation fixtures
        run: cargo test --locked -- --include-ignored

      - name: Build release
        run: cargo build --locked --release
