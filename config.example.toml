# Optional read-only page and /api/status. Always binds to 127.0.0.1.
[status]
enabled = false
port = 8044

[orchestrator]
# AppFlowy, Vaultite, and API-backed Shortcut poll in Rust and wake coordination on changes.
# Shortcut without API settings uses periodic coordinator reads. This also sets the retry interval.
poll_interval_seconds = 30
coordinator_timeout_seconds = 300
worker_timeout_seconds = 3600
# Daily Dreams start after this time in the daemon's local timezone.
dream_time = "03:00"
# Diagnostic logs, OS locks, and daily dream checkpoints.
# runtime_dir = "~/.local/state/maistro"

[agents]
# Provider is global; projects can independently override worker model and effort.
provider = "codex" # "codex" or "claude" (Claude Code CLI)
# Omit models for provider defaults: Codex gpt-6-luna/gpt-6-astra; Claude haiku/opus.
# coordinator = "gpt-6-luna" # Coordinator
# worker = "gpt-6-astra" # Implementation workers
# Optional effort overrides; omit to preserve inherited configuration/provider defaults.
# Codex: none, minimal, low, medium, high, xhigh, max, ultra.
# Claude: low, medium, high, xhigh, max (requires CLI --effort support).
# Available levels also depend on the selected model and CLI version.
# coordinator_effort = "low" # Coordinator
# worker_effort = "high" # Implementation workers
# Uses the selected CLI's existing login and source MCP connections.
# codex = "/home/you/.local/bin/codex"
# codex_home = "~/.codex"
# claude = "/home/you/.local/bin/claude"
# claude_mcp_config = "~/.claude.json" # JSON with top-level mcpServers; user scope
# Fallback MCP entry for AppFlowy projects.
mcp_server = "appflowy"
# Private file created by install.sh for projects with a named remote.
# github_token_file = "~/.config/maistro/github-token"

[[projects]]
id = "example"
repo = "/absolute/path/to/repo"
# Select exactly one board or workflow.
appflowy_page = "Example Backlog" # Or appflowy_url when the name is ambiguous.
# Shortcut options:
# shortcut_workflow = "Agents" # Exact, unique name in the workspace.
# shortcut_workspace = "deecide"
# shortcut_token_file = "~/.config/maistro/shortcut-deecide-token" # Private read-only v4 token.
# shortcut_workflow_id = 500005096 # Positive numeric workflow ID, not a story ID.
# shortcut_url = "https://app.shortcut.com/your-workspace/settings/workflows/123" # Existing links still work.
# vaultite_base = "Projects/Service/Stories.base" # Requires local vau mcp and a Stories/ folder beside the Base.
# mcp_server = "vaultite" # Optional override. Defaults depend on the source; see README.md.
mode = "pr" # "pr": push a story branch and open a PR. "master": deliver on base_branch.
base_branch = "main" # May be main, master, or another branch.
remote = "origin" # Default. Set false in master mode to commit locally without a remote.
enabled = true
# Optional overrides of agents.worker and agents.worker_effort, independently.
# Omit both levels for the provider model default and inherited/default effort.
# worker = "gpt-6-luna"
# worker_effort = "medium"
# Optional repository-root maistro-coordinator.md and maistro-worker.md add
# instructions for each agent; no prompt configuration is needed (see README.md).

[projects.statuses]
backlog = "Backlog"
ready = "Ready"
in_progress = "In Progress"
review = "Review" # Set false to disable in master mode; PR requests will be blocked.
done = "Done"
blocked = "Blocked"
cancelled = "Cancelled" # Set false to disable. Archiving still revokes active work.
