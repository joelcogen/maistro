# Optional read-only page and /api/status. Always binds to 127.0.0.1.
[status]
enabled = false
port = 8044

[orchestrator]
# AppFlowy: cheap Rust polls; unchanged boards do not call the coordinator.
# Shortcut: periodic coordinator reads through the selected CLI, including while idle.
# Also controls bounded failure retries.
poll_interval_seconds = 30
coordinator_timeout_seconds = 300
worker_timeout_seconds = 3600
# Diagnostic logs and OS locks only. No local story database.
# runtime_dir = "~/.local/state/maistro"

[agents]
# Global for ALL projects; per-project provider/model overrides are not supported.
provider = "codex" # "codex" or "claude" (Claude Code CLI)
# Omit models for provider defaults: Codex gpt-6-luna/gpt-6-astra; Claude haiku/opus.
# small_model = "gpt-6-luna" # Coordinator
# big_model = "gpt-6-astra" # Implementation workers
# Uses the selected CLI's existing login and source MCP connections.
# codex = "/home/you/.local/bin/codex"
# codex_home = "~/.codex"
# claude = "/home/you/.local/bin/claude"
# claude_mcp_config = "~/.claude.json" # JSON with top-level mcpServers; user scope
mcp_server = "appflowy"
# Private file created by install.sh; loaded for each worker, never added to prompts.
# github_token_file = "~/.config/maistro/github-token"

[[projects]]
id = "example"
repo = "/absolute/path/to/repo"
appflowy_page = "Example Backlog"
# Use appflowy_url instead of appflowy_page if the name is ambiguous.
# For Shortcut, replace the AppFlowy target with your actual workflow link:
# shortcut_url = "https://app.shortcut.com/your-workspace/settings/workflows/123"
# Optional per-project MCP server name (also supported for AppFlowy):
# mcp_server = "shortcut" # Default: shortcut for Shortcut, agents.mcp_server otherwise.
# Authorize Shortcut MCP in the selected CLI before starting; see README.md.
mode = "pr" # "pr": push a story branch and open a PR; "master": commit/push base_branch
base_branch = "main" # May be main, master, or another branch.
remote = "origin"
enabled = true
# Optional repository-root maistro-coordinator.md and maistro-worker.md add
# instructions for each agent; no prompt configuration is needed (see README.md).

[projects.statuses]
backlog = "Backlog"
ready = "Ready"
in_progress = "In Progress"
review = "Review" # Set false to disable in master mode; PR requests will be blocked.
done = "Done"
blocked = "Blocked"
cancelled = "Cancelled" # Set false to disable; Shortcut archive still cancels work.
