[package]
name = "maistro"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "Small AppFlowy/Shortcut/Codex coding orchestrator"

[[bin]]
name = "maistro"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"
libc = "0.2"
process-wrap = { version = "10", default-features = false, features = ["tokio1", "process-group"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
rmcp = { version = "=3.9.0", default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest", "reqwest"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "serde", "v5"] }


[profile.release]
lto = "thin"
strip = true
