[package]
name = "maistro"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "Small AppFlowy/Codex coding orchestrator"

[[bin]]
name = "maistro"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }


[profile.release]
lto = "thin"
strip = true
