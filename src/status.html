<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maistro · Status</title>
<link rel="stylesheet" href="status.css">
<script src="status.js" defer></script>
</head>
<body>
<header class="app-header"><div><h1>Maistro</h1><p id="uptime" class="muted">Waiting for status…</p></div>
<p id="connection" class="notice connecting" role="status" aria-live="polite">Connecting… No status received yet.</p></header>
<main>
<noscript><p class="notice">JavaScript is required to load and refresh status.</p></noscript>
<section class="agents-section" aria-labelledby="agents-heading"><h2 id="agents-heading">Agents</h2><div id="daemon"></div></section>
<section aria-labelledby="overall-heading"><h2 id="overall-heading">Overview</h2><div id="overall"></div></section>
<section class="projects-section" aria-labelledby="projects-heading"><h2 id="projects-heading">Projects</h2><div id="projects" class="projects"></div></section>
</main>
</body>
</html>
