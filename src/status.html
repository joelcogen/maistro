<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Maistro · Status</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="vendor/tabler-1.7.5/tabler.min.css">
  <link rel="stylesheet" href="status.css">
  <script src="status.js" defer></script>
</head>
<body>
  <div class="page">
    <header class="navbar d-print-none">
      <div class="container-xl gap-2 py-2">
        <div class="d-flex align-items-center gap-2">
          <img src="favicon.svg" alt="" width="36" height="36">
          <div>
            <h1 class="navbar-brand m-0 p-0">Maistro</h1>
            <p id="uptime" class="small text-secondary tabular-nums mb-0">Uptime unavailable</p>
          </div>
        </div>
        <div class="d-flex flex-wrap align-items-center gap-2 small">
          <span id="connection" class="status status-yellow" role="status">
            <span class="status-dot" aria-hidden="true"></span>
            <span id="connection-state">Connecting…</span>
          </span>
          <span id="connection-detail" class="text-secondary tabular-nums"></span>
        </div>
      </div>
    </header>
    <div class="page-wrapper">
      <main class="page-body">
        <div class="container-xl">
          <noscript><p class="alert alert-warning">JavaScript is required to load and refresh status.</p></noscript>
          <section aria-labelledby="overall-heading">
            <h2 id="overall-heading" class="mb-2">Overview</h2>
            <div id="overall">
              <div class="card card-sm">
                <p class="card-body text-secondary mb-0">No status received yet.</p>
              </div>
            </div>
          </section>
          <section id="agents-section" class="mt-4" aria-labelledby="agents-heading" hidden>
            <h2 id="agents-heading" class="mb-2">Agents</h2>
            <div id="daemon"></div>
          </section>
          <section id="projects-section" class="mt-4" aria-labelledby="projects-heading" hidden>
            <h2 id="projects-heading" class="mb-2">Projects</h2>
            <div id="projects" class="d-grid gap-3"></div>
          </section>
        </div>
      </main>
    </div>
  </div>
</body>
</html>
